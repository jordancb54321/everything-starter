[package]
name = "everything-starter"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
eframe = "0.29"
egui = "0.29"
rfd = "0.17"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
