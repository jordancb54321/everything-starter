[package]
name = "everything-starter"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Windows desktop dashboard for planning tasks and choosing what to do next"
repository = "https://github.com/jordancb54321/everything-starter"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
eframe = "0.29"
egui = "0.29"
fs2 = "0.4"
rfd = "0.17"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
